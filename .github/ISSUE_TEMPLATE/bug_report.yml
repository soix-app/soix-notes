name: Bug report
description: Something in the app is broken, including cloud sync problems
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A few details up front save us both a round of
        back-and-forth.

        **Write in whatever language you're comfortable with** — I read English and
        Chinese directly and translate the rest.

        **Never include** passwords, vault keys, recovery codes, or private note
        content in this form. If your report is security-sensitive, email
        **support@soix.app** instead of opening a public issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this does not look like a duplicate
          required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in the app's About dialog. Filled in automatically if you opened this from the app.
      placeholder: 1.0.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe the problem as you experienced it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: Skip this if it is already obvious from the description above.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        If you can trigger it on purpose, list the steps. If it happens
        unpredictably, say so and describe what you were doing at the time —
        that is still useful.
      placeholder: |
        1. Open ...
        2. Click ...
        3. The note ...
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen
      options:
        - Every time
        - Often, but not always
        - Happened once
        - Not sure yet
    validations:
      required: true

  - type: input
    id: sync_backend
    attributes:
      label: Cloud sync
      description: >
        Which backend this vault uses, even if the problem seems unrelated to
        sync. Filled in automatically if you opened this from the app.
        Otherwise: OneDrive, WebDAV, none, or leave it if you are not sure.
      placeholder: OneDrive
    validations:
      required: true

  - type: textarea
    id: sync_details
    attributes:
      label: If this is a sync problem
      description: >
        Sync issues depend heavily on your setup. Three things make the
        difference between me investigating immediately and asking questions for
        a week: which WebDAV server software and version you use, the OS and app
        version of the *other* device, and a rough timeline of what you did
        where. Approximate times are fine.
      placeholder: |
        WebDAV server: Nextcloud 29 (or Synology DSM 7.2, Nutstore, ...)
        Other device: Windows 10 22H2, app 1.0.0.0

        - Tue evening, laptop: edited "Trip plan", closed the app
        - Wed morning, desktop: "Trip plan" still shows the old text
        - Wed 10:00, laptop: reopened the app, my edit is gone too
    validations:
      required: false

  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Paste any error text or dialog contents. Remove anything sensitive first.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Screenshots or a short screen recording help a lot for visual problems —
        you can drag files into this box.
    validations:
      required: false

  - type: input
    id: language
    attributes:
      label: App language
      description: Filled in automatically if you opened this from the app.
      placeholder: en
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Confirmation
      options:
        - label: This report contains no passwords, vault keys, recovery codes, or private note content
          required: true
