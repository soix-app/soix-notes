name: Feature request
description: Suggest something Soix Notes should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are read and labelled, then reviewed in batches. I cannot promise
        a timeline, and not everything will get built — but what does get built is
        decided largely by what people ask for here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions for the same idea
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: >
        Describe the situation you run into, not only the feature you have in mind.
        There is often a simpler solution, and it only becomes visible once the
        underlying problem is clear.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today
      description: A workaround, another app, or simply doing without.
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How much does this matter to you
      options:
        - Nice to have
        - Would noticeably improve my daily use
        - I cannot fully switch to Soix Notes without it
    validations:
      required: false
